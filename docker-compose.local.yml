services:
  nuxt:
    container_name: nuxt
    build:
      context: ./nuxt
      dockerfile: local.Dockerfile
    entrypoint: /bin/sh
    working_dir: /web
    volumes:
      - './nuxt:/web'
      - /web/node_modules
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi-nuxt.rule=Host(`strapi-nuxt.localhost`)"
      - "traefik.http.services.strapi-nuxt.loadbalancer.server.port=${NUXT_TRAEFIK_PORT:-3000}"
    networks:
      - strapi
      - proxy
    depends_on:
      - strapi

  strapi:
    container_name: strapi
    build:
      context: ./strapi
      dockerfile: local.Dockerfile
    working_dir: /opt
    volumes:
      - ./strapi:/opt
      - /opt/node_modules
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-strapi-nuxt.rule=Host(`admin.strapi-nuxt.localhost`)"
      - "traefik.http.services.admin-strapi-nuxt.loadbalancer.server.port=${STRAPI_TRAEFIK_PORT:-1337}"
    networks:
      - strapi
      - proxy
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDB
    platform: linux/amd64 #for platform error on Apple M1 chips
    image: postgres:12.0-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/ #using a volume
      #- ./data:/var/lib/postgresql/data/ # if you want to use a bind folder
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    networks:
      - strapi

volumes:
  strapi-data:

networks:
  strapi:
    name: Strapi
    driver: bridge
  proxy:
    name: "traefik_network" # registered as standalone container outside this project
    external: true