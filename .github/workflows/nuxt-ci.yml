name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: nuxt

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nuxt/package-lock.json

      - name: Install npm
        run: npm install --global npm@11 && npm config set fetch-retries 5 -g

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
